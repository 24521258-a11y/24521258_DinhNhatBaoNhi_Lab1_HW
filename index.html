<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dinh Nhat Bao Nhi | Developer Portfolio</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="skeleton.css">
</head>

<body>

  <!-- Accessible Skip Link -->
  <a href="#main-content" class="skip-link">
    Skip to main content
  </a>

  <!-- Header Landmark -->
  <header role="banner">

    <h1>Dinh Nhat Bao Nhi</h1>

    <button
      id="theme-toggle"
      type="button"
      aria-pressed="false"
    >
      Dark Mode
    </button>

  </header>

  <!-- Primary Navigation -->
  <nav
    role="navigation"
    aria-label="Primary"
  >
    <ul>
      <li>
        <a href="#about">About</a>
      </li>

      <li>
        <a href="#projects">Projects</a>
      </li>
    </ul>
  </nav>

  <!-- Main Content -->
  <main
    id="main-content"
    role="main"
  >

    <!-- About Section -->
    <section id="about">

      <h2>About Me</h2>

      <p>
        Welcome to my developer portfolio.
      </p>

    </section>

    <!-- Projects Section -->
    <section id="projects">

      <h2>Featured Projects</h2>

      <!--
        Exercise 3:
        JavaScript will render the component states here:
        loading, live, empty and error.
      -->
      <section
        id="project-container"
        aria-label="Project list"
        aria-live="polite"
      >
      </section>

    </section>

  </main>

  <!-- JavaScript -->
  <script src="app.js"></script>

</body>

</html>
